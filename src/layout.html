<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Emberwright">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{page_description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://emberwright-mods.com/assets/img/social-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0d1120">
<link rel="icon" type="image/png" sizes="32x32" href="{{root}}assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/site.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-discord" viewBox="0 0 24 24"><path d="M7.2 6.5c1.5-.7 3.1-1 4.8-1s3.3.3 4.8 1c1.8 2.3 2.7 5.5 3 8.8-1.2 1-2.6 1.7-4.1 2l-.9-1.4m-5.6 0-.9 1.4c-1.5-.3-2.9-1-4.1-2 .3-3.3 1.2-6.5 3-8.8Z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></symbol>
  <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h13v5a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8Z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M7 2v3m4-3v3m4-3v3"/></symbol>
</svg>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{home}}">
      <img src="{{root}}assets/img/mark-hq.svg" alt="" width="18" height="32">
      <span class="brand-name"><strong>ARCHITECT LINES</strong><small>EMBERWRIGHT</small></span>
    </a>
    <div class="topbar-end">
      {{nav}}
      <nav class="lang" aria-label="{{t.lang.label}}">{{switcher}}</nav>
    </div>
  </div>
</header>
<main>
{{content}}
</main>
<footer class="footer">
  <div class="wrap">
    <nav class="footer-links" aria-label="{{t.footer.label}}">
      <a href="https://discord.gg/Pbev3kJmdu">Discord</a>
      <a href="{{page.privacy}}">{{t.footer.privacy}}</a>
      <a href="{{page.legal}}">{{t.footer.legal}}</a>
    </nav>
    <p>{{t.footer.license}}</p>
    <p>{{t.footer.affiliation}}</p>
  </div>
</footer>
</body>
</html>
